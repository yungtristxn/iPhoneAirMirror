[package]
name = "airmirror-lite"
version = "0.1.0"
edition = "2024"
publish = false
description = "Minimal Windows AirPlay screen and audio receiver"
build = "build.rs"

[features]
default = []
# The accepted receiver and default build continue using FDK. The explicit
# FFmpeg candidate is separate; add decoder-lab to forbid receiver startup.
decoder-lab = []
ffmpeg-aac = []
# Controlled local interoperability test; not enabled in packaged candidates.
rotation-advertisement-experiment = []
display-update-experiment = ["rotation-advertisement-experiment"]
hap-pairing-experiment = ["display-update-experiment"]

[dependencies]
aes = "=0.8.4"
cbc = "=0.1.2"
ctr = "=0.9.2"
sha2 = "=0.10.9"
ed25519-dalek = "=2.2.0"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
rand = "=0.8.5"
plist = "=1.8.0"
anyhow = "=1.0.100"
zeroize = "=1.8.2"
chacha20poly1305 = "=0.10.1"
hkdf = "=0.12.4"
srp = { version = "=0.7.0-rc.3", default-features = false }
sha2_11 = { package = "sha2", version = "=0.11.1", features = ["zeroize"] }

[build-dependencies]
cc = "=1.2.46"

[dev-dependencies]
hex = "=0.4.3"
base64 = "=0.22.1"
serde_json = "=1.0.145"

[profile.release]
lto = "thin"
codegen-units = 1
