[package]
name = "airmirror-lite"
version = "0.1.0"
edition = "2024"
publish = false
description = "Minimal Windows AirPlay screen and audio receiver"
build = "build.rs"

[features]
default = []
# The accepted receiver and default build continue using FDK. The explicit
# FFmpeg candidate is separate; add decoder-lab to forbid receiver startup.
decoder-lab = []
ffmpeg-aac = []

[dependencies]
aes = "=0.8.4"
cbc = "=0.1.2"
ctr = "=0.9.2"
sha2 = "=0.10.9"
ed25519-dalek = "=2.2.0"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
rand = "=0.8.5"
plist = "=1.8.0"
anyhow = "=1.0.100"
zeroize = "=1.8.2"

[build-dependencies]
cc = "=1.2.46"

[dev-dependencies]
hex = "=0.4.3"
base64 = "=0.22.1"

[profile.release]
lto = "thin"
codegen-units = 1
